<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sketchpad</title>
  <meta name="description" content="A free, fast drawing app that runs in your browser. Draw together live.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="favicon.svg" alt="" width="22" height="22"> Sketchpad</div>
    <div class="actions">
      <button id="undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button id="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
      <span class="sep"></span>
      <button id="import" data-icon="image" title="Insert image (or paste / drop one)" aria-label="Insert image"></button>
      <button id="clear" data-icon="trash" title="Clear canvas" aria-label="Clear canvas"></button>
      <span class="sep"></span>
      <div id="presence" class="presence" aria-label="People on this board"></div>
      <button id="share" data-icon="users" title="Draw together live"><span>Share</span></button>
      <button id="download" class="primary" data-icon="download" title="Download PNG (Ctrl+S)"><span>Save</span></button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </header>

  <nav class="toolbar" aria-label="Tools">
    <button class="tool" data-tool="brush" data-icon="brush" title="Brush (B)" aria-label="Brush"></button>
    <button class="tool" data-tool="marker" data-icon="marker" title="Highlighter (M)" aria-label="Highlighter"></button>
    <button class="tool" data-tool="eraser" data-icon="eraser" title="Eraser (E)" aria-label="Eraser"></button>
    <span class="tool-sep"></span>
    <button class="tool" id="shape-tool" data-tool="shape" aria-label="Shapes" aria-haspopup="menu" aria-expanded="false"></button>
    <button class="tool" data-tool="text" data-icon="text" title="Text (T)" aria-label="Text"></button>
    <span class="tool-sep"></span>
    <button class="tool" data-tool="fill" data-icon="bucket" title="Fill (F)" aria-label="Fill"></button>
    <button class="tool" data-tool="picker" data-icon="pipette" title="Color picker (I)" aria-label="Color picker"></button>
  </nav>
  <div id="shape-menu" class="shape-menu" role="menu" aria-label="Shapes" hidden></div>

  <main id="stage">
    <div id="canvas-wrap">
      <canvas id="board"></canvas>
      <canvas id="overlay"></canvas>
      <div id="cursor"></div>
    </div>
    <div id="toast" role="status" hidden></div>
  </main>

  <section class="props" aria-label="Tool options">
    <div class="swatches" id="swatches"></div>
    <label class="color-custom" title="Custom color"><input type="color" id="color" value="#1e1e1e" aria-label="Custom color"></label>
    <label class="slider">Size <input type="range" id="size" min="1" max="80" value="6"><output id="size-val">6</output></label>
    <label class="slider">Opacity <input type="range" id="opacity" min="5" max="100" value="100"><output id="opacity-val">100%</output></label>
    <label class="slider">Fill
      <select id="fill-mode" aria-label="Shape fill">
        <option value="none">None</option>
        <option value="tint">Light</option>
        <option value="solid">Solid</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="dashed"> Dashed</label>
  </section>

  <dialog id="join-dialog" aria-labelledby="join-title">
    <form id="join-form">
      <h2 id="join-title">Join live board</h2>
      <p class="hint">Pick a name so others can see who's drawing.</p>
      <label class="field">Your name
        <input id="join-name" maxlength="24" required autocomplete="nickname" placeholder="e.g. Karan">
      </label>
      <label class="field" id="room-field">Board code
        <input id="join-room" maxlength="32" required pattern="[A-Za-z0-9_\-]+" autocapitalize="off" spellcheck="false">
        <small>Keep this code to start a new board, or type a friend's code to join theirs.</small>
      </label>
      <div class="dialog-actions">
        <button type="button" id="join-cancel">Cancel</button>
        <button type="submit" class="primary">Join</button>
      </div>
    </form>
  </dialog>

  <dialog id="share-dialog" aria-labelledby="share-title">
    <h2 id="share-title">You're live</h2>
    <p class="hint">Send this link to anyone. They'll just enter a name to join and draw with you.</p>
    <div class="share-row">
      <input id="share-link" readonly aria-label="Board link">
      <button type="button" id="copy-link" class="primary">Copy link</button>
    </div>
    <p id="people-status" class="hint"></p>
    <ul id="people" class="people"></ul>
    <div class="dialog-actions">
      <button type="button" id="leave-room">Leave board</button>
      <button type="button" id="share-done" class="primary">Done</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
